    ; 2026-10-28 晚：换满电电池后推力恢复（829‰@90cm），此前为压振荡降过的
    ; 高度环增益已过软 → 目标 22cm 冲到 94cm。恢复并加强。
    ; 2026-10-29：目标 15cm 实测 45cm 却只给 -2.4% 油门削减（kp 0.20 × 0.12m/s），
    ; 不足以让飞机下沉 → 一直悬在 45cm。提高比例增益。
    ; 2026-10-29：到达 23cm 后油门被砍到 590（远低于悬停）导致触地，降低 kp。
    ; 2026-10-29：到 31cm 后砍到 556‰ 掉地，再降一档 kp。
    ; 同上：降低比例增益，减小振荡幅度。
    -DCL_VERTICAL_KP=0.30f
    ; 2026-10-29：允许的最大下砍幅度 12%（前馈 800 → 最低 680）。
    -DCL_HOLD_CUT_LIMIT=0.12f
    ; 2026-10-29：改用保持型高度控制（只准往上、到了冻结），避免 PI 砍过头。
    ; 2026-10-31：分段开关式换成串级（高度→期望速度→PI→油门），消除开关振荡。
    ; 2026-10-30：动力疑似临界，低于目标直接给满油门。
    ; 2026-10-30：起飞 0.7s 就 LINK_LOST 停机，放宽链路判定到 800ms。
    -DRADIO_LINK_TIMEOUT_MS=800U
    ; 到位后大死区冻结、下降更慢，保证不低于 20cm。
    -DCL_HEIGHT_DEADBAND_M=0.04f
    -DCL_HEIGHT_OVERSHOOT_M=0.12f
    ; 2026-10-31：0.8/s 补油过猛导致振荡，改 0.5/s。
    -DCL_HEIGHT_SINK_SLEW=0.50f
    ; 2026-10-31：阻尼 0.6 太弱，带速度冲到 88cm；提到 1.5 提前减速。
    -DCL_HEIGHT_VZ_DAMP=1.50f
    ; 2026-10-31：45% 太狠（砍到 676 低于悬停），放到 72%。
    ; 2026-10-31：72% 在 79cm 处撑不住会沉，抬到 85%。
    -DCL_HEIGHT_FAR_ABOVE_FLOOR=0.82f
    ; 2026-10-31：惯性融合实测发散（vy 卡在 150cm/s 限幅），暂时关闭。
    -DCL_HEIGHT_CLIMB_SLEW=0.12f
    ; 2026-10-31：按 0.25 秒的速度预判提前收油，抑制冲高。
    -DCL_HEIGHT_VZ_LEAD_SEC=0.50f
    ; 2026-10-31：目标 40cm 却一路冲到 82cm 不下来，下降加快到 0.45/s。
    -DCL_HEIGHT_DESCEND_SLEW=0.25f
    ; 2026-10-29：横向仍漂（vx 达 41cm/s），把光流刹车权限从 1° 提到 3°。
    -DCL_FLOW_BRAKE_ANGLE_LIMIT_DEG=3.0f
    -DCL_FLOW_BRAKE_GAIN=3.0f
    ; 2026-10-31：电池 3 秒内开始衰减，需要积分快速顶上去；KI 0.10→0.25。
    -DCL_VERTICAL_KI=0.25f
    ; 2026-10-28 实飞：起飞段 roll 从 2.6° 长到 5~7.5°，低油门姿态权限不足。
    -DCL_ATTITUDE_AUTHORITY_COLLECTIVE=0.15f
    ; 2026-10-28：光流采信间歇丢失导致 0.25s 后自动降落，放宽断流超时到 1.0s。
    -DCL_FLOW_MISSING_TIMEOUT_SEC=1.0f
    ; 2026-10-28：门限 15°/s 时 fg 全程 0，先放到 60°/s 并记录 gyro_z 验证。
    ; 2026-10-29：位置保持模式下同样要防"旋转被当成平移"，门限 20°/s。
    ; 偏航已压到 +5~10°/s，门限 20→30（原来频繁暂停采信）。
    ; 门限 30→35，容忍起飞瞬间的角速度尖峰。
    -DCL_FLOW_YAW_GATE_DPS=35.0f
    ; 2026-10-30：roll 长期 +5~8°，横滚差动在 8% 饱和；光流倾角也顶在 5°。
    ; 2026-10-31：场地小、一漂就出界 → 加大光流位置环修正力度。
    ; 位置误差→期望速度：1.6→2.5（10cm 误差直接给到速度上限）。
    -DCL_FLOW_VELOCITY_GAIN=2.5f
    ; 2026-10-31：偏移仍大。角度增益 8→16：速度误差 0.5m/s 就能给出 8° 倾角。
    ; 2026-10-31：符号修正后 16 太猛，回到 10。
    -DCL_FLOW_ANGLE_GAIN_DEG_PER_MPS=10.0f
    -DCL_FLOW_POSITION_DEADBAND_M=0.02f
    -DCL_ROLL_DUTY_LIMIT=0.15f
    -DCL_FLOW_ANGLE_LIMIT_DEG=14.0f
    ; 2026-10-31：翻转实验证明两者性能相同 → 保持原符号 +1。
    -DCL_FLOW_FRAME_SIGN=1.0f
    ; 2026-10-31：爬升时 vz 常 0.4~0.6，门限 0.25 会让光流全程关闭 → 放到 0.6。
    -DCL_FLOW_VZ_GATE_MPS=0.60f
    ; 2026-10-31：日志改为记录光流累计位移(mm)，量化实际漂移。
    -DCL_LOG_POSITION=1
    ; 2026-10-31 实验：光流 x/y 轴对调（安装旋转 90° 的可能）。
    -DCL_FLOW_FRAME_SWAP=1
    ; 2026-10-28：起飞段 ToF 偶发断档导致 LAUNCH 中止，宽限 0.10→0.30s。
    -DCL_TOF_GAP_GRACE_SEC=0.30f
    ; 2026-10-28 实飞：起飞段 pitch 到 -15°，俯仰修正顶在 4% 限幅，翻倍到 8%。
    -DCL_RATE_PITCH_YAW_LIMIT=0.20f
    ; 2026-10-28 实飞：偏航/俯仰存在固定偏置，积分限幅 ±10‰ 饱和，放宽到 ±50‰
    ; 并把 Ki 提到 0.0002（收敛更快）。
    ; 2026-10-31：偏航持续 +30°/s，而积分上限只有 50‰ → 权限不足。放到 120‰。
    ; 2026-10-31：偏航+25°/s 时 corr_yaw 只有 −60‰ 且无效 → 权限仍不足，放到 200‰。
    -DCL_RATE_INTEGRAL_LIMIT=0.20f
    ; 2026-10-31：实测偏航持续 +19°/s，而 KI=0.0002 要 13 秒才能积满 5% 差动。
    ; 光流无旋转补偿，机体自转会让它把"旋转"误判成"平移"→ 越修越偏。提高 KI 快速压偏航。
    ; 2026-10-31：KI 0.002 过冲（+19→−37°/s），取中间值 0.0008。
    ; 2026-10-31：2 秒才积到 −83‰（上限 200），收敛太慢；提到 0.003。
    ; 2026-10-31：一次飞行仅 3 秒，偏航积分必须 0.7 秒内收敛（30°/s → 200‰）。
    ; roll/pitch 回到原值（0.01 会造成 5Hz 姿态振荡）；偏航用 CL_RATE_KI_YAW=0.01。
    -DCL_RATE_KI=0.0002f

