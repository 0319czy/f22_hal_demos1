[platformio]
default_envs = contest_hover
src_dir = src

[env:contest_hover]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=9600U
    -DUSART4_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -Isrc/sensors
    -Isrc/flight
build_src_filter =
    +<main.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/i2c.c>
    +<hal/Src/i2c_bus_recovery.c>
    +<hal/Src/sensors.c>
    +<hal/Src/stm32f1xx_it.c>
    +<sensors/*.c>
    +<flight/*.c>
lib_ldf_mode = off
lib_compat_mode = off
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
; F22 CH340 automatic ISP: keep the board-verified RTS/DTR sequence.
upload_protocol = serial
upload_flags =
    -R
    -i
    -rts,-dtr,dtr:rts,-dtr,dtr
extra_scripts = pre:extra_scripts/ch340_port.py

; Board-only verification of the production calibration, no flow/ToF or PWM.
[env:contest_aircraft1_closed_loop]
extends = env:contest_hover
build_flags =
    ${env:contest_hover.build_flags}
    -DAIRCRAFT1_INTEGRATION=1

[env:contest_aircraft1_pwm_closed_loop]
extends = env:contest_aircraft1_closed_loop
build_flags =
    ${env:contest_aircraft1_closed_loop.build_flags}
    -DAIRCRAFT1_PHYSICAL=1
build_src_filter =
    ${env:contest_hover.build_src_filter}
    +<hal/Src/aircraft1_pwm.c>

; V2 remote task bridge, verified RF50k settings, async JP13 telemetry.
; Radio closed-loop power trial, shared controller/PWM limits; not hover-calibrated.
[env:contest_aircraft1_radio_v2_jp13]
extends = env:contest_aircraft1_pwm_closed_loop
build_flags =
    ${env:contest_aircraft1_pwm_closed_loop.build_flags}
    -DCLOSED_LOOP_RADIO_V2=1
    -DCL_LOG_JP13=1
    -DCL_RADIO_POWER_PROFILE=1
build_src_filter =
    ${env:contest_aircraft1_pwm_closed_loop.build_src_filter}
    +<bench/radio_fast_config.c>
extra_scripts =

[env:contest_imu_check]
extends = env:contest_hover
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -Isrc/flight
build_src_filter =
    +<bench/imu_check.c>
    +<flight/imu_calibration.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/i2c.c>
    +<hal/Src/sensors.c>
    +<hal/Src/stm32f1xx_it.c>

; Propeller-free direction check: fixed low duty, F3/F4 or link loss stops.
; Reuses the verified v2/v3 receiver and JP13 telemetry, no flight feedback.
[env:contest_motor_direction]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_DIRECTION_CHECK=1
build_src_filter =
    ${env:contest_aircraft1_radio_v2_jp13.build_src_filter}
    +<bench/motor_direction.c>

[env:contest_aircraft1_standalone]
extends = env:contest_aircraft1_pwm_closed_loop
build_flags =
    ${env:contest_aircraft1_pwm_closed_loop.build_flags}
    -DAIRCRAFT1_STANDALONE=1
    -UUSART1_DEMO_BAUDRATE
    -DUSART1_DEMO_BAUDRATE=115200U
extra_scripts =

; Propeller-free attitude/rate check. 15% base, 20% hard ceiling, no ToF control.
[env:contest_attitude_check_jp13]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_ATTITUDE_CHECK=1
build_src_filter =
    ${env:contest_aircraft1_radio_v2_jp13.build_src_filter}
    +<bench/attitude_check.c>

; Explicit first tether trial: corrected axes, launch <=90%, motor ceiling90%.
; Captured takeoff demand feeds the 20cm sensor-range height controller.
[env:contest_tethered_flight_jp13]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_TETHERED_FLIGHT=1

; Isolated full-range takeoff test, without requiring uncalibrated optical flow.
; Keeps the tethered launch ramp, timeout, attitude checks, link checks and F4 stop.
[env:contest_tethered_flight_jp13_pwm100]
extends = env:contest_tethered_flight_jp13
build_flags =
    ${env:contest_tethered_flight_jp13.build_flags}
    -DCL_TETHERED_PWM100=1

; Explicit motor-enabled debug image. All other tether/diagnostic targets stay locked.
[env:contest_tethered_flight_debug_jp13_pwm100]
extends = env:contest_tethered_flight_jp13_pwm100
build_flags =
    ${env:contest_tethered_flight_jp13_pwm100.build_flags}
    -DCL_TETHERED_DEBUG_OUTPUT=1

; Low-altitude tuning: IMU attitude/rate plus ToF vertical hold, no flow control.
[env:contest_imu_tof_low_hover_jp13]
extends = env:contest_tethered_flight_debug_jp13_pwm100
build_flags =
    ${env:contest_tethered_flight_debug_jp13_pwm100.build_flags}
    -DCL_LOW_HOVER_TEST=1
    -DCL_VOFA_JUSTFLOAT=1
    -DCL_VOFA_FIREWATER=1
    -Wl,-u,_printf_float

; Same low-hover controller, with the DAP telemetry/tuning UART on JP14.
[env:contest_imu_tof_low_hover_jp14]
extends = env:contest_imu_tof_low_hover_jp13
build_flags =
    ${env:contest_imu_tof_low_hover_jp13.build_flags}
    -UCL_LOG_JP13

; Wider first-liftoff window: same 12cm low-hover controller, but ToF freshness
; 150->250ms, launch timeout 3->5s and launch ramp 500->800 permille/s.
; Text [CL] logs kept (no VOFA) so a DAP monitor can read state/link/ready.
; Built for tuning; not flight-verified.
[env:contest_imu_tof_low_hover_wide_jp13]
extends = env:contest_tethered_flight_debug_jp13_pwm100
build_flags =
    ${env:contest_tethered_flight_debug_jp13_pwm100.build_flags}
    -DCL_LOW_HOVER_TEST=1
    -DCL_WIDE_LAUNCH_WINDOW=1
    -DTOF_MAX_AGE_MS=250U
    -DCL_LAUNCH_TIMEOUT_SEC=5.0f
    ; 2026-10-30：起飞斜坡 0.6→0.9，更快到达 20cm 以上，给悬停留时间。
    -DCL_LAUNCH_RAMP_DUTY_PER_SEC=0.9f
    ; 2026-10-27 实飞：5‰ 抬头补偿后爬升段 pitch 变成 +3.15°/+4.59°（抬头），
    ; 说明补偿过头；回调到 3‰，其余参数不动。
    ; 2026-10-28 晚：飞行段 pitch 长期 −6°，差动 +30~60‰ 仍压不回 0°，
    ; 说明机头持续下压；把前向补偿 3‰ 加到 8‰。
    -DCL_FRONT_DRIFT_TRIM=0.008f
    ; 2026-10-27 满电实测：融合高度最高 74mm，未达 80mm 交接门限，5 次起飞全停在 LAUNCH。
    ; 2026-10-29 晚：目标 20cm 却冲到 48cm（交接时爬升 0.6m/s，动量带过头）。
    ; 更早交接 + 更柔和的斜坡，减小上冲。
    -DCL_TAKEOFF_RANGE_M=0.05f
    ; 2026-10-27 抗扰第一步：rate_kp 0.0008→0.0012（扰动回正更快），其余不动。
    -DCL_RATE_KP=0.0012f
    ; 2026-10-28 实飞：高度环 ±5% 限幅卡死导致冲高到 318mm（目标 200mm）。
    ; 放宽到 ±10%，并加快下修速度 0.25→0.35。
    ; 2026-10-28 实飞：交接前馈被记成 940~1000‰，真实悬停只需 870~900‰，
    ; ±10% 权限压不下去 → 一路爬到 330mm 或掉到 43mm。放宽到 ±20%。
    ; 2026-10-28 晚：交接前馈被记成 ~973‰（起飞末段油门），±20% 只能压到 776‰
    ; 仍大于悬停所需 → 卡在下限一路爬到 1.2m 硬上限触发 HEIGHT_INVALID。放到 ±40%。
    ; 修正上限 30%→45%，允许追到接近满油门。
    -DCL_VERTICAL_LIMIT=0.45f
    ; 2026-10-28 晚：交接前馈 930‰ 远大于实际悬停，0.35/s 下修太慢，冲到 82cm 后
    ; 又只以 0.12m/s 缓慢回落。加快下修并允许更快下降。
    ; 2026-10-28 晚：1:10 的升降不对称导致"砍过头补不回"，改成 0.6:0.6。
    -DCL_COLLECTIVE_SLEW_DOWN=0.6f
    -DCL_COLLECTIVE_SLEW_UP=0.6f
    ; 2026-10-29：开启重心偏置在线学习（用四路差速实时抵消固定力矩偏置）。
    -DCL_TRIM_LEARN=1
    ; 2026-10-29：实测 roll 偏置 +3.6~8.3° 收敛太慢（2.5s 只学到 50‰），KI 加倍。
    ; 2026-10-30：实测 roll 长期 +6~8°，学习上限 12% 不够，且收敛太慢。
    ; 2026-10-30: KI 0.03 会在 1.5 秒内学满 25%（过冲，反而制造倾斜），改回温和值。
    ; 2026-10-31：姿态振荡消除后，实测 roll 稳定偏 +5~8°，需要更快吃掉的偏置学习。
    -DCL_TRIM_LEARN_KI=0.015f
    -DCL_TRIM_LEARN_LIMIT=0.18f
    ; 2026-10-28 实飞：HOLD 段在 13~29cm 之间波动，贴 20cm 会低于比赛下限。
    ; 目标抬到 25cm，并降低接近目标时的速度目标，压住冲高。
    ; 2026-10-28 晚：当前动力只能稳定在 15cm 附近，先降目标把控制链路跑通。
    ; 2026-10-29：先保证达到 20cm（实测能到 23cm），目标回到 22cm。
    ; 2026-10-29：实测到 20~25cm 后即使油门加到 945 仍下沉，先抬到 30cm 留余量。
    ; 2026-10-29：目标按用户要求抬到 1.0m（规则上限 100cm；固件硬上限 1.2m）。
    ; 2026-10-29 晚：满电电池+四电机正常，但 20cm 以上仍出现"油门加到 941 还下沉"。
    ; 先回到推力需求最低的合规高度 20cm，保证能飞。
    ; 2026-10-29 晚：高度环存在 ~1s 周期 ±5cm 振荡；目标设 25cm，让谷底仍在 20cm 以上。
    ; 2026-10-30：目标"20cm 以上保持 2 秒"，宁高不低 → 目标 30cm。
    ; 2026-10-30：越高越需要推力（且电池带载会塌），改成 22cm 附近停住。
    ; 2026-10-30：实测 77cm 能稳定悬停（u≈835，规则上限 100cm），目标设 30cm。
    ; 2026-10-30：实测 63cm、u≈837 悬停很稳；下降会进入涡环状态导致坠地。
    ; 目标设 50cm、死区 10cm（40~60cm 冻结），规则允许 20~100cm。
    ; 2026-10-30：实测可持续悬停上限约 25~30cm（到 37cm 后即使 977‰ 也下沉）。
    ; 目标设 25cm（规则下限 20cm 以上留 5cm 余量）。
    ; 2026-10-31：留余量但不浪费推力 → 目标 22cm（下限 20cm + 2cm）。
    ; 2026-10-31：按用户要求把目标设为 40cm。
    ; 2026-10-31：40cm 够不到（实测最高 32.6cm），且满油门冲高形成振荡。
    ; 改为目标 22cm + 温和爬升，消除"冲上去再掉下来"的极限环。
    ; 2026-10-31：它总会冲高到 35cm（推力过 30cm 就塌），因此把目标降到 18cm，
    ; 靠惯性实际停在 20~25cm，正好在规则下限之上、推力够用的范围内。
    ; 2026-10-31：实测 55cm 用 850‰ 很稳（推力舒适区），按规则 20~100cm 设 40cm。
    ; 2026-10-31：目标降到 30cm（推力余量更大）。
    ; 2026-10-31：数据反复显示 60~80cm 最省力（720~800‰），规则允许 20~100cm。
    ; 2026-10-31：85% 在整段高度都是净爬升 → 会撞 100cm 上限；
    ; 目标设 80cm（合规上限 100cm 之下留 20cm），并允许高处减到 80%。
    -DCL_TARGET_RANGE_M=0.80f
    -DCL_HEIGHT_TO_VZ_GAIN=1.5f
    ; 2026-10-29：1 米目标需要更快爬升，速度上限放大到 0.30 m/s。
    -DCL_VZ_TARGET_LIMIT_MPS=0.25f
    ; 2026-10-28 晚：交接前馈 930~973‰ 远高于真实悬停 ~700‰，缩到 0.75 减少冲高。
    ; 0.75 压过头（551‰ 撑不住 → 掉高度），回到 0.88
    -DCL_HOVER_FF_SCALE=0.88f
    -DCL_HOVER_FF_FIXED=0.83f
    ; 2026-10-28 晚：前馈改用"上次 HOLD 实测平均油门"（存 0x0803D000），
    ; 没有学习值时退回 0.80。
    -DCL_HOVER_LEARNED=1
    ; 2026-10-28 实飞：1 秒周期 ±5cm 振荡，降 kp/ki；目标 25→22cm 减小推力压力。
    ; 2026-10-28 晚：换满电电池后推力恢复（829‰@90cm），此前为压振荡降过的
    ; 高度环增益已过软 → 目标 22cm 冲到 94cm。恢复并加强。
    ; 2026-10-29：目标 15cm 实测 45cm 却只给 -2.4% 油门削减（kp 0.20 × 0.12m/s），
    ; 不足以让飞机下沉 → 一直悬在 45cm。提高比例增益。
    ; 2026-10-29：到达 23cm 后油门被砍到 590（远低于悬停）导致触地，降低 kp。
    ; 2026-10-29：到 31cm 后砍到 556‰ 掉地，再降一档 kp。
    ; 同上：降低比例增益，减小振荡幅度。
    -DCL_VERTICAL_KP=0.30f
    ; 2026-10-29：允许的最大下砍幅度 12%（前馈 800 → 最低 680）。
    -DCL_HOLD_CUT_LIMIT=0.12f
    ; 2026-10-29：改用保持型高度控制（只准往上、到了冻结），避免 PI 砍过头。
    ; 2026-10-31：分段开关式换成串级（高度→期望速度→PI→油门），消除开关振荡。
    ; 2026-10-30：动力疑似临界，低于目标直接给满油门。
    ; 2026-10-30：起飞 0.7s 就 LINK_LOST 停机，放宽链路判定到 800ms。
    -DRADIO_LINK_TIMEOUT_MS=800U
    ; 到位后大死区冻结、下降更慢，保证不低于 20cm。
    -DCL_HEIGHT_DEADBAND_M=0.04f
    -DCL_HEIGHT_OVERSHOOT_M=0.12f
    ; 2026-10-31：0.8/s 补油过猛导致振荡，改 0.5/s。
    -DCL_HEIGHT_SINK_SLEW=0.50f
    ; 2026-10-31：阻尼 0.6 太弱，带速度冲到 88cm；提到 1.5 提前减速。
    -DCL_HEIGHT_VZ_DAMP=1.50f
    ; 2026-10-31：45% 太狠（砍到 676 低于悬停），放到 72%。
    ; 2026-10-31：72% 在 79cm 处撑不住会沉，抬到 85%。
    -DCL_HEIGHT_FAR_ABOVE_FLOOR=0.82f
    ; 2026-10-31：惯性融合实测发散（vy 卡在 150cm/s 限幅），暂时关闭。
    -DCL_HEIGHT_CLIMB_SLEW=0.12f
    ; 2026-10-31：按 0.25 秒的速度预判提前收油，抑制冲高。
    -DCL_HEIGHT_VZ_LEAD_SEC=0.50f
    ; 2026-10-31：目标 40cm 却一路冲到 82cm 不下来，下降加快到 0.45/s。
    -DCL_HEIGHT_DESCEND_SLEW=0.25f
    ; 2026-10-29：横向仍漂（vx 达 41cm/s），把光流刹车权限从 1° 提到 3°。
    -DCL_FLOW_BRAKE_ANGLE_LIMIT_DEG=3.0f
    -DCL_FLOW_BRAKE_GAIN=3.0f
    ; 2026-10-31：电池 3 秒内开始衰减，需要积分快速顶上去；KI 0.10→0.25。
    -DCL_VERTICAL_KI=0.25f
    ; 2026-10-28 实飞：起飞段 roll 从 2.6° 长到 5~7.5°，低油门姿态权限不足。
    -DCL_ATTITUDE_AUTHORITY_COLLECTIVE=0.15f
    ; 2026-10-28：光流采信间歇丢失导致 0.25s 后自动降落，放宽断流超时到 1.0s。
    -DCL_FLOW_MISSING_TIMEOUT_SEC=1.0f
    ; 2026-10-28：门限 15°/s 时 fg 全程 0，先放到 60°/s 并记录 gyro_z 验证。
    -DCL_FLOW_YAW_GATE_DPS=60.0f
    ; 2026-10-28：起飞段 ToF 偶发断档导致 LAUNCH 中止，宽限 0.10→0.30s。
    -DCL_TOF_GAP_GRACE_SEC=0.30f
    ; 2026-10-28 实飞：起飞段 pitch 到 -15°，俯仰修正顶在 4% 限幅，翻倍到 8%。
    -DCL_RATE_PITCH_YAW_LIMIT=0.20f
    ; 2026-10-28 实飞：偏航/俯仰存在固定偏置，积分限幅 ±10‰ 饱和，放宽到 ±50‰
    ; 并把 Ki 提到 0.0002（收敛更快）。
    ; 2026-10-31：偏航持续 +30°/s，而积分上限只有 50‰ → 权限不足。放到 120‰。
    ; 2026-10-31：偏航+25°/s 时 corr_yaw 只有 −60‰ 且无效 → 权限仍不足，放到 200‰。
    -DCL_RATE_INTEGRAL_LIMIT=0.20f
    ; 2026-10-31：实测偏航持续 +19°/s，而 KI=0.0002 要 13 秒才能积满 5% 差动。
    ; 光流无旋转补偿，机体自转会让它把"旋转"误判成"平移"→ 越修越偏。提高 KI 快速压偏航。
    ; 2026-10-31：KI 0.002 过冲（+19→−37°/s），取中间值 0.0008。
    ; 2026-10-31：2 秒才积到 −83‰（上限 200），收敛太慢；提到 0.003。
    ; 2026-10-31：一次飞行仅 3 秒，偏航积分必须 0.7 秒内收敛（30°/s → 200‰）。
    ; roll/pitch 回到原值（0.01 会造成 5Hz 姿态振荡）；偏航用 CL_RATE_KI_YAW=0.01。
    -DCL_RATE_KI=0.0002f
    ; 2026-10-27 实飞：悬停段 gyro_z 持续 +19~22°/s（机头右偏），
    ; 加 -3‰ 偏航补偿（负值应增加 CW 对 M1/M6 的推力占比，产生反向力矩）。
    ; 2026-10-31：实测偏航偏置 +21~+33°/s（整机一直在自转），单靠积分压不住，
    ; 加固定偏航补偿 −20‰（此前 −10‰ 约抵消 8°/s，按比例取 −20‰）。
    ; 2026-10-31：固定补偿在这个偏置下无效（−20‰ 后仍 +30°/s），归零交给积分。
    -DCL_YAW_TRIM=0.000f

; 2026-10-28 光流抗扰 A：仅速度阻尼（不追位置），门限已放宽到 10°/15°/s。
[env:contest_flow_brake_wide_jp13]
extends = env:contest_tethered_flow_brake_trial_jp13
build_flags =
    ${env:contest_tethered_flow_brake_trial_jp13.build_flags}
    -DTOF_MAX_AGE_MS=250U
    -DCL_LAUNCH_TIMEOUT_SEC=5.0f
    ; 2026-10-30：起飞斜坡 0.6→0.9，更快到达 20cm 以上，给悬停留时间。
    -DCL_LAUNCH_RAMP_DUTY_PER_SEC=0.9f
    ; 2026-10-28 晚：当前动力只能稳定在 15cm 附近，先降目标把控制链路跑通。
    ; 2026-10-29：先保证达到 20cm（实测能到 23cm），目标回到 22cm。
    ; 2026-10-29：实测到 20~25cm 后即使油门加到 945 仍下沉，先抬到 30cm 留余量。
