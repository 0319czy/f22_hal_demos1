[platformio]
default_envs = tle100
src_dir = .

[env:tle100]
platform = intel_mcs51@2.2.0
board = AT89S52
build_src_filter = +<main.c>
upload_protocol = custom
upload_command = python3 "$PROJECT_DIR/tools/upload_progisp.py" "$SOURCE"

; Separate, timestamped communication test; never use this for motor control.
[env:tle100_latency]
extends = env:tle100
build_src_filter = +<latency_main.c> +<key_events.c>

[env:tle100_latency_fast]
extends = env:tle100_latency
build_flags = -DLATENCY_RADIO_FAST=1

[env:tle100_latency_uart_fast]
extends = env:tle100_latency_fast
build_flags =
    ${env:tle100_latency_fast.build_flags}
    -DLATENCY_UART_FAST=1

; Automatic synthetic F1-F4 events for a real wireless endurance test.
[env:tle100_latency_autotest]
extends = env:tle100_latency_fast
build_flags =
    ${env:tle100_latency_fast.build_flags}
    -DLATENCY_AUTO_KEYS=1

; Keep the previously validated v2 sender available for explicit comparisons.
[env:tle100_latency_v2]
extends = env:tle100_latency
build_src_filter = +<latency_main.c>
build_flags = -DLATENCY_PROTOCOL_V2=1

[env:tle100_latency_fast_v2]
extends = env:tle100_latency_v2
build_flags =
    ${env:tle100_latency_v2.build_flags}
    -DLATENCY_RADIO_FAST=1
