[platformio]
default_envs = contest_hover
src_dir = src

[env:contest_hover]
platform = ststm32
board = genericSTM32F103RC
framework = stm32cube
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=9600U
    -DUSART4_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -Isrc/sensors
    -Isrc/flight
build_src_filter =
    +<main.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/i2c.c>
    +<hal/Src/sensors.c>
    +<hal/Src/stm32f1xx_it.c>
    +<sensors/*.c>
    +<flight/*.c>
lib_ldf_mode = off
lib_compat_mode = off
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
; F22 CH340 automatic ISP: keep the board-verified RTS/DTR sequence.
upload_protocol = serial
upload_flags =
    -R
    -i
    -rts,-dtr,dtr:rts,-dtr,dtr
extra_scripts = pre:extra_scripts/ch340_port.py

; Board-only verification of the production calibration, no flow/ToF or PWM.
[env:contest_aircraft1_closed_loop]
extends = env:contest_hover
build_flags =
    ${env:contest_hover.build_flags}
    -DAIRCRAFT1_INTEGRATION=1

[env:contest_aircraft1_pwm_closed_loop]
extends = env:contest_aircraft1_closed_loop
build_flags =
    ${env:contest_aircraft1_closed_loop.build_flags}
    -DAIRCRAFT1_PHYSICAL=1
build_src_filter =
    ${env:contest_hover.build_src_filter}
    +<hal/Src/aircraft1_pwm.c>

; V2 remote task bridge, verified RF50k settings, async JP13 telemetry.
; Radio closed-loop power trial, shared controller/PWM limits; not hover-calibrated.
[env:contest_aircraft1_radio_v2_jp13]
extends = env:contest_aircraft1_pwm_closed_loop
build_flags =
    ${env:contest_aircraft1_pwm_closed_loop.build_flags}
    -DCLOSED_LOOP_RADIO_V2=1
    -DCL_LOG_JP13=1
    -DCL_RADIO_POWER_PROFILE=1
build_src_filter =
    ${env:contest_aircraft1_pwm_closed_loop.build_src_filter}
    +<bench/radio_fast_config.c>
extra_scripts =

[env:contest_imu_check]
extends = env:contest_hover
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -Isrc/flight
build_src_filter =
    +<bench/imu_check.c>
    +<flight/imu_calibration.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/i2c.c>
    +<hal/Src/sensors.c>
    +<hal/Src/stm32f1xx_it.c>

; Propeller-free direction check: fixed low duty, F3/F4 or link loss stops.
; Reuses the verified v2/v3 receiver and JP13 telemetry, no flight feedback.
[env:contest_motor_direction]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_DIRECTION_CHECK=1
build_src_filter =
    ${env:contest_aircraft1_radio_v2_jp13.build_src_filter}
    +<bench/motor_direction.c>

[env:contest_aircraft1_standalone]
extends = env:contest_aircraft1_pwm_closed_loop
build_flags =
    ${env:contest_aircraft1_pwm_closed_loop.build_flags}
    -DAIRCRAFT1_STANDALONE=1
    -UUSART1_DEMO_BAUDRATE
    -DUSART1_DEMO_BAUDRATE=115200U
extra_scripts =

; Propeller-free attitude/rate check. 15% base, 20% hard ceiling, no ToF control.
[env:contest_attitude_check_jp13]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_ATTITUDE_CHECK=1
build_src_filter =
    ${env:contest_aircraft1_radio_v2_jp13.build_src_filter}
    +<bench/attitude_check.c>

; Explicit first tether trial: corrected axes, launch <=90%, motor ceiling90%.
; Captured takeoff demand feeds the 20cm sensor-range height controller.
[env:contest_tethered_flight_jp13]
extends = env:contest_aircraft1_radio_v2_jp13
build_flags =
    ${env:contest_aircraft1_radio_v2_jp13.build_flags}
    -DCL_TETHERED_FLIGHT=1

; Isolated full-range takeoff test, without requiring uncalibrated optical flow.
; Keeps the tethered launch ramp, timeout, attitude checks, link checks and F4 stop.
[env:contest_tethered_flight_jp13_pwm100]
extends = env:contest_tethered_flight_jp13
build_flags =
    ${env:contest_tethered_flight_jp13.build_flags}
    -DCL_TETHERED_PWM100=1

; Flow-aware candidate: ground IMU, calibrated usable flow blends into XY damping.
; Operator-requested 100% maximum, same ramp and captured takeoff reference.
; F2 refuses flight until physical flow axes/calibration have been accepted.
[env:contest_flow_assist_jp13]
extends = env:contest_tethered_flight_jp13
build_flags =
    ${env:contest_tethered_flight_jp13.build_flags}
    -DCL_FLOW_ASSIST=1

; Temporary identification diagnosis. Raw-only fallback never claims presence;
; main forces STOP every cycle, even if the radio requests takeoff.
[env:contest_flow_id_probe_jp13]
extends = env:contest_flow_assist_jp13
build_flags =
    ${env:contest_flow_assist_jp13.build_flags}
    -DFLOW_ID_PROBE=1

; A/B comparison only. Inherits both main-loop STOP and physical PWM lock.
[env:contest_flow_spi_duplex_probe_jp13]
extends = env:contest_flow_id_probe_jp13
build_flags =
    ${env:contest_flow_id_probe_jp13.build_flags}
    -DFLOW_SPI_DUPLEX_PROBE=1

; Full sampling evidence for scale/rotation fitting. Motors remain hard locked.
[env:contest_flow_calibration_jp13]
extends = env:contest_flow_spi_duplex_probe_jp13
build_flags =
    ${env:contest_flow_spi_duplex_probe_jp13.build_flags}
    -DFLOW_CAL_CAPTURE=1
build_src_filter =
    ${env:contest_flow_spi_duplex_probe_jp13.build_src_filter}
    +<bench/flow_capture.c>
    +<bench/flow_capture_bus.c>


[env:contest_motor_preview]
extends = env:contest_hover
build_src_filter =
    +<bench/motor_check.c>
    +<bench/motor_bench.c>
    +<flight/radio.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

[env:contest_motor_m1]
extends = env:contest_motor_preview
build_flags =
    ${env:contest_hover.build_flags}
    -DBENCH_OUTPUT_ENABLE=1
    -DBENCH_MOTOR_INDEX=1U
    -DBOARD_SINGLE_MOTOR_INDEX=1U
    -DBOARD_TIM3_PERIOD_US=66U
    -DBOARD_TIM4_PERIOD_US=66U
build_src_filter =
    ${env:contest_motor_preview.build_src_filter}
    +<hal/Src/tim.c>

[env:contest_motor_m2]
extends = env:contest_motor_m1
build_flags =
    ${env:contest_hover.build_flags}
    -DBENCH_OUTPUT_ENABLE=1
    -DBENCH_MOTOR_INDEX=2U
    -DBOARD_SINGLE_MOTOR_INDEX=2U
    -DBOARD_TIM3_PERIOD_US=66U
    -DBOARD_TIM4_PERIOD_US=66U

[env:contest_motor_m3]
extends = env:contest_motor_m1
build_flags =
    ${env:contest_hover.build_flags}
    -DBENCH_OUTPUT_ENABLE=1
    -DBENCH_MOTOR_INDEX=3U
    -DBOARD_SINGLE_MOTOR_INDEX=3U
    -DBOARD_TIM3_PERIOD_US=66U
    -DBOARD_TIM4_PERIOD_US=66U

[env:contest_motor_m4]
extends = env:contest_motor_m1
build_flags =
    ${env:contest_hover.build_flags}
    -DBENCH_OUTPUT_ENABLE=1
    -DBENCH_MOTOR_INDEX=4U
    -DBOARD_SINGLE_MOTOR_INDEX=4U
    -DBOARD_TIM3_PERIOD_US=66U
    -DBOARD_TIM4_PERIOD_US=66U

; Explicit auto-start circuit test; full DC on M3, no radio gate or PWM.
[env:contest_motor_m3_direct]
extends = env:contest_hover
build_src_filter =
    +<bench/motor_m3_direct.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>

; Explicit circuit test: M1-M4 full DC together after a 2000ms delay.
[env:contest_motor_quad_direct]
extends = env:contest_motor_m3_direct
build_flags =
    ${env:contest_hover.build_flags}
    -DBENCH_DIRECT_QUAD=1
    -DBENCH_DIRECT_START_DELAY_MS=2000U

; Same quad circuit test, with USB/JP13 text diagnostics for M4.
[env:contest_motor_quad_diag]
extends = env:contest_motor_quad_direct
build_flags =
    -DSTM32F103xE
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000UL
    -DUSART1_DEMO_BAUDRATE=115200U
    -DUSART2_DEMO_BAUDRATE=115200U
    -Isrc/hal/Inc
    -DBENCH_DIRECT_QUAD=1
    -DBENCH_DIRECT_START_DELAY_MS=2000U
    -DBENCH_DIRECT_DIAGNOSTICS=1
build_src_filter =
    ${env:contest_motor_m3_direct.build_src_filter}
    +<hal/Src/usart.c>

; M1-M4 together: 15kHz PWM, exactly 30/200=15%, auto-start after 2s.
[env:contest_motor_m1234_pwm15]
extends = env:contest_motor_m3_direct
build_src_filter =
    +<bench/motor_m1234_pwm15.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>

; Propeller-free M1/M2/M3/M6 bench: KEY1 toggles constant 15%, KEY2 stops.
[env:contest_motor_m1236_pwm15]
extends = env:contest_aircraft1_standalone
build_src_filter =
    +<bench/motor_m1236_pwm15.c>
    +<flight/motor_continuous.c>
    +<flight/standalone_keys.c>
    +<hal/Src/aircraft1_pwm.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; Propeller-free 50% bench: remote F1 starts, F3/F4 or either local key stops.
; USART1 is RX-only 9600, independent JP13 USART2 logs at 115200.
[env:contest_motor_radio50]
extends = env:contest_hover
extra_scripts =
build_flags =
    ${env:contest_hover.build_flags}
    -DUSART2_DEMO_BAUDRATE=115200U
    -DAIRCRAFT1_PHYSICAL=1
    -DAIRCRAFT1_PWM_MAX_DUTY=.50f
    -DMOTOR_CONTINUOUS_DUTY=.50f
build_src_filter =
    +<bench/motor_radio50.c>
    +<flight/motor_radio.c>
    +<flight/motor_continuous.c>
    +<flight/radio.c>
    +<hal/Src/aircraft1_pwm.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; Temporary low-rate shared-USB diagnostics, same radio bench behavior.
[env:contest_motor_radio50_usb]
extends = env:contest_motor_radio50
monitor_speed = 9600
monitor_dtr = 1
monitor_rts = 1
build_flags =
    ${env:contest_motor_radio50.build_flags}
    -DMOTOR_RADIO_LOG_USB=1

; Safe serial-path diagnostic: both UARTs transmit, all motor outputs held low.
[env:contest_uart_dual_probe]
extends = env:contest_hover
build_flags =
    ${env:contest_hover.build_flags}
    -DUSART2_DEMO_BAUDRATE=115200U
build_src_filter =
    +<bench/uart_dual_probe.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; PA2 flips every 2 seconds so JP13 TXD2 can be checked with a DC meter.
[env:contest_jp13_voltage_probe]
extends = env:contest_hover
build_src_filter =
    +<bench/jp13_voltage_probe.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; Receive-only radio diagnostic on shared USB/USART1. Motor pins remain low.
[env:contest_radio_rx_probe]
extends = env:contest_hover
build_flags =
    ${env:contest_hover.build_flags}
    -DUSART2_DEMO_BAUDRATE=115200U
build_src_filter =
    +<bench/radio_rx_probe.c>
    +<flight/radio.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; Wireless DAP telemetry through JP13; USART1 only receives E49 data.
[env:contest_radio_rx_jp13]
extends = env:contest_radio_rx_probe
build_flags =
    ${env:contest_radio_rx_probe.build_flags}
    -DRADIO_RX_LOG_USB=0

; Per-packet reception timestamps, v1/v2 diagnostic support; all motors LOW.
[env:contest_radio_latency_jp13]
extends = env:contest_radio_rx_jp13
extra_scripts =
build_src_filter =
    +<bench/radio_latency.c>
    +<flight/radio_trace.c>
    +<flight/radio.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

[env:contest_radio_latency_fast]
extends = env:contest_radio_latency_jp13
build_flags =
    ${env:contest_radio_latency_jp13.build_flags}
    -DLATENCY_RADIO_FAST=1
build_src_filter =
    ${env:contest_radio_latency_jp13.build_src_filter}
    +<bench/radio_fast_config.c>

[env:contest_radio_latency_compact]
extends = env:contest_radio_latency_fast
build_flags =
    ${env:contest_radio_latency_fast.build_flags}
    -DLATENCY_COMPACT_LOG=1

[env:contest_radio_latency_uart_fast]
extends = env:contest_radio_latency_compact
build_flags =
    ${env:contest_radio_latency_compact.build_flags}
    -DLATENCY_UART_FAST=1

; Physical JP13 TX/RX loopback; results via USB at 9600, motors held off.
[env:contest_jp13_loopback]
extends = env:contest_hover
build_flags =
    ${env:contest_hover.build_flags}
    -DUSART2_DEMO_BAUDRATE=115200U
build_src_filter =
    +<bench/jp13_loopback.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>

; Slow-baud comparison for the JP13 level-converted output and DAP input.
[env:contest_jp13_loopback_9600]
extends = env:contest_jp13_loopback
build_flags =
    ${env:contest_hover.build_flags}
    -DUSART2_DEMO_BAUDRATE=9600U

; UART2 hardware vs software UART, normal/inverted; all motors off.
[env:contest_jp13_software_audit]
extends = env:contest_jp13_loopback
build_src_filter =
    +<bench/jp13_software_audit.c>
    +<hal/Src/common.c>
    +<hal/Src/system_clock.c>
    +<hal/Src/gpio.c>
    +<hal/Src/usart.c>
    +<hal/Src/stm32f1xx_it.c>
